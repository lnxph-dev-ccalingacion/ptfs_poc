version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: ptfs-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ptfs-net

  solr:
    image: solr:9.6
    container_name: ptfs-solr
    ports:
      - "8983:8983"
    environment:
      SOLR_HEAP: "512m"
    volumes:
      - solr_data:/var/solr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/info/system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ptfs-net

volumes:
  minio_data:
  solr_data:

networks:
  ptfs-net:
    driver: bridge
